# CRC cell-line context-GEM run (DepMap 24Q4, 59 colorectal lines).
# Drives the server tINIT extraction + pFBA/MOMA simulation. See SERVER_RUN.md.

name: crc_depmap_celllines
outdir: result/crc_celllines
notes: >
  59 DepMap colorectal-adenocarcinoma cell lines, each a context. All are
  proliferative (cancer) -> pFBA reference -> MOMA. Flux input to the mortality
  predictor excludes growth (biomass + ATP maintenance). Labels = DepMap 0-1
  dependency probability (data/depmap/crc_trainset/crc_dependency.parquet).

input:
  data_source: bulk           # cell-line bulk expression
  data_provenance: real
  batch_correction: none      # DepMap is already uniformly processed; single cohort
  gse_datasets: [DepMap_24Q4]

extraction:
  algorithm: tinit
  scaffold_model: data/scaffold/Human-GEM.xml   # ENSG-native; Recon3D as robustness axis
  gap_filling: true
  threshold_strategy: global_percentile
  threshold_value: 25         # p25 of pooled GPR reaction scores = present/absent cut
  protected_reactions: []     # biomass auto-protected as the objective

moma:
  formulation: quadratic
  proliferative_statuses: [DepMap_24Q4]   # all CRC lines are proliferative
  proliferative_reference: pfba
  nonproliferative_readout: not_applicable # no non-proliferative context here
  lethal_growth_fraction: 0.05
  gpr_aware_deletion: true
  report_continuous_ratio: true

sampling:                     # only if OptGP WT clouds are wanted (--optgp-n)
  n_samples: 1000
  thinning: 100
  n_chains: 2
  seed: 0
  method: optgp
  r_hat_max: 1.1
  ess_min: 100
  on_nonconvergence: report

solver: null                  # server: gurobi or cplex (auto-select best available)
