# CRC_GEM run configuration TEMPLATE
#
# Values written as `null` are OPEN design decisions. The code refuses to run
# with them unset — that is deliberate. Fill them only after the decision is
# ratified, and record the rationale in documentation/status.md.
#
# Copy to config/<run_name>.yaml, fill in, and commit the filled file so every
# result can be traced to the exact protocol that produced it.

name: TEMPLATE_do_not_run
outdir: result/TEMPLATE
notes: >
  Describe what this run is for and which design decisions it assumes.

input:
  # Full 2x2: run every combination as a first-class case.
  data_source: null        # bulk | single_cell
  data_provenance: null    # real | generated
  batch_correction: scfoundation_gene_space   # gene-space denoise, NOT latent
  gse_datasets: []         # provenance: which GSE accessions were pooled

# null = auto-select the best available (gurobi > cplex > glpk).
# Extraction additionally requires a MILP-capable solver; preflight enforces it.
solver: null
threads: null

extraction:
  algorithm: tinit           # tinit | imat | gimme | fastcore  (TROPPO)
  scaffold_model: null       # OPEN (Q2): Human-GEM vs Recon3D — verify first
  gap_filling: true          # tINIT constituent (task-driven); keep true
  threshold_strategy: null   # e.g. global_percentile — must be stated
  threshold_value: null
  protected_reactions: []    # e.g. the biomass reaction id

moma:
  formulation: quadratic         # quadratic (Segre 2002) default; linear only at per-cell scale
  # Reference flux is chosen by whether the state maximises growth (user 2026-07-27):
  proliferative_statuses: []     # states that DO (cancer, adenoma) -> FBA-reference MOMA
  proliferative_reference: pfba  # RULED: pFBA. (Residual non-uniqueness ~31.6%
                                 # is disclosed via the degeneracy diagnostic.)
  face_ensemble_n: null          # only for face_ensemble
  nonproliferative_readout: distance_to_normal
                                 # RULED concept (user): NOT growth-lethality —
                                 # does the KO move the disease fluxome toward
                                 # untreated normal, without moving normal?
                                 # Metric (mmd | mahalanobis | pearson_mean)
                                 # still under discussion; see distribution.py.
  lethal_growth_fraction: 0.05   # proliferative branch: KO growth < 5% of WT FBA
  gpr_aware_deletion: true       # fixes BRCA defect P1; do not disable
  report_continuous_ratio: true  # keep threshold sensitivity visible

sampling:
  n_samples: null            # RULED: 200 or 1000, predefined before the run
  thinning: null
  n_chains: null             # >= 2 required for R-hat
  seed: null
  method: optgp
  r_hat_max: null            # acceptance criterion
  ess_min: null
  on_nonconvergence: null    # abort | escalate_thinning | report
